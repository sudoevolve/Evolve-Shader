name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare package metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          }
          else {
            $version = "manual-${{ github.run_number }}"
          }

          "archive_name=Evolve-Shader-$version-windows-x64.zip" >> $env:GITHUB_OUTPUT
          "package_root=dist\Evolve-Shader" >> $env:GITHUB_OUTPUT

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build
          cmake --build build --config $env:BUILD_CONFIGURATION --parallel

      - name: Assemble release package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "${{ steps.meta.outputs.package_root }}"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "dist\${{ steps.meta.outputs.archive_name }}"
          Remove-Item -Recurse -Force $packageRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          Copy-Item "build\Release\EvolveShader.exe" $packageRoot
          foreach ($runtimeDir in @("frag", "iChannel", "presets")) {
            if (Test-Path "build\Release\$runtimeDir") {
              Copy-Item -Recurse "build\Release\$runtimeDir" (Join-Path $packageRoot $runtimeDir)
            }
          }

          foreach ($file in @("LICENSE", "readme.md", "README.zh-CN.md", "1.png", "2.png")) {
            if (Test-Path $file) {
              Copy-Item $file $packageRoot
            }
          }

          Remove-Item -Force $archivePath -ErrorAction SilentlyContinue
          Compress-Archive -Path $packageRoot -DestinationPath $archivePath -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.archive_name }}
          path: dist\${{ steps.meta.outputs.archive_name }}

      - name: Publish GitHub release asset
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "dist\${{ steps.meta.outputs.archive_name }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $archivePath --title $tag --generate-notes
          }
          else {
            gh release upload $tag $archivePath --clobber
          }
